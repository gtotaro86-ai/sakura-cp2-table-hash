name: Update DeepSeek Engram model card
on:
  push:
    paths:
      - 'deepseek-engram/MODEL_CARD.md'
      - 'deepseek-engram/update_model_card.py'
      - '.github/workflows/deepseek-engram-card.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakura-engram-model-card
  cancel-in-progress: false
jobs:
  metadata:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface-hub==2.2.0
      - name: Validate and publish only README; verify unchanged GGUF hashes
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deepseek-engram/update_model_card.py
