name: Publish Unsloth CP2
on:
  workflow_dispatch:
    inputs:
      variant:
        description: One examined Unsloth variant
        required: true
        type: choice
        options:
          - UD-IQ1_S
          - UD-IQ1_M
          - UD-Q2_K_XL
permissions:
  contents: read
jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install huggingface_hub==1.30.0
      - name: Stream shard 2 and copy unchanged files
        run: python publish_unsloth_cp2.py "${{ inputs.variant }}"
      # No artifacts, caches, paid runners, or token output.
