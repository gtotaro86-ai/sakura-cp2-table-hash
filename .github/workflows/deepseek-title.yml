name: Correct Sakura Maya-S model-card heading
on:
  push:
    branches: [main]
    paths: ['deepseek-family-title/fix_title.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakura-deepseek-maya-title
  cancel-in-progress: false
jobs:
  title:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      SAKURA_FREE_STANDARD_RUNNER: ubuntu-24.04
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source hashes and Python syntax
        run: |
          cd deepseek-family
          sha256sum -c SHA256SUMS
          python -m py_compile cards.py ../deepseek-family-title/fix_title.py
      - run: python -m pip install huggingface-hub==2.2.0 PyYAML==6.0.3
      - name: Correct the README heading and verify all other file identities
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u deepseek-family-title/fix_title.py
